<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VSinger &amp; Singer Tracker — VTuber songs, MVs and covers</title>
  <meta
    name="description"
    content="Track VTuber and VSinger singing streams, music videos and covers, alongside real human singers and producers. Live now, upcoming, and searchable — across YouTube, Twitch, Bilibili, Niconico and VK."
  />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="VSinger &amp; Singer Tracker" />
  <meta
    property="og:description"
    content="VTuber songs, music videos and covers — live now, upcoming, and searchable by region."
  />

  <!--
    The webfonts are loaded here rather than with an `@import` inside the
    stylesheet, and they no longer block the first paint.

    The sheet is 383 KB uncompressed — 344 `@font-face` rules, 118 subsets —
    and a plain `<link rel="stylesheet">` holds the first pixel until every
    byte of it has arrived and been parsed. As a print-media sheet it is
    fetched at low priority and applied the moment it lands, and because the
    URL already carries `display=swap` the text paints in the fallback face
    either way: all the wait ever bought was a later first paint.

    The preconnects stay, so DNS, TLS and HTTP/2 are warm when the request
    goes out, and a browser without JavaScript still gets the sheet through
    the `noscript` fallback.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    />
  </noscript>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />

  <script>
    // Apply the persisted theme before the first paint so the page never
    // flashes the wrong colour scheme.
    (function () {
      try {
        var stored = localStorage.getItem('vst.theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        /* private mode — fall back to the light theme */
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <noscript>
    This tracker needs JavaScript to search the dataset. The raw dataset is
    available as JSON under <code>/data/</code>.
  </noscript>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
