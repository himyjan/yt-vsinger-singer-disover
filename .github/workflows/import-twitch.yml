name: Import Twitch VTubers

# Harvests Twitch and imports the new channels the gate admits into
# data/channels/. The harvest writes `.cache/twitch/twitch.json`, and the
# importer reads it, matches each row against the dataset by Twitch broadcaster
# id, classifies through classifyChannel(), and adds the survivors.
#
# Requires TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET GitHub Actions secrets.
# Without them the harvest is skipped and nothing is imported.
#
#   npm run data:twitch              # harvest VTuber candidates from Twitch
#   npm run data:twitch-import       # report what would be imported
#   npm run data:twitch-import -- --apply  # write the new channels

on:
  schedule:
    # Weekly, Monday 03:30 UTC (after the sync's roster pass)
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest-and-import:
    name: Harvest and import Twitch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Twitch cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/twitch
          key: twitch-harvest-${{ github.run_number }}
          restore-keys: |
            twitch-harvest-

      - name: Harvest Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: npm run data:twitch

      - name: Import Twitch channels
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would import Twitch channels"
            npm run data:twitch-import
          else
            npm run data:twitch-import -- --apply
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit Twitch imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "Twitch imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import Twitch VTubers (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import Twitch VTubers"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | Twitch (Helix search/channels) |"
            echo "| Credentials | TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET |"
            echo "| Step | harvest → import → index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
