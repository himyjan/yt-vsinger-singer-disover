name: Fill external links (parallel)

# `externals` for the records that have **nothing beyond `youtube`** — a real
# artist no roster carries (Taylor Swift is the example this exists for).
#
# `fill-links.yml` only knows what HoloList and bacharu publish, which is a
# VTuber roster. The platform's own **about page** is where every channel
# publishes its other accounts, and `fill-details` already reads it — sampled
# over fourteen channels with an empty `externals`, the microformat supplied
# zero links while the about page supplied them for ten.
#
# **Why a pass of its own.** The default details backlog is ordered worst
# first, and a record that merely lacks its links scores lowest, so a
# well-known artist with an avatar, an audience and an upload total sits
# behind tens of thousands with no picture and is never reached by a bounded
# run. `--externals-only` selects exactly the 11,110 records whose `externals`
# holds nothing but `youtube`, and orders them oldest-asked-first so a sweep
# advances instead of re-reading the same head.
#
# This file is only the schedule and the inputs: the volume fan-out, the
# artifact hand-off and the scoped commit live in `fill-details-parallel.yml`,
# which this calls with `mode: externals`. One implementation, two schedules.

on:
  schedule:
    # Daily at 06:17 UTC: after the roster jobs (04:00) and the details pass
    # (05:17), off the hour so the shared GitHub cron pool is not the
    # bottleneck.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max channels per volume this run"
        required: false
        default: "600"
      interval:
        description: "Milliseconds between requests inside one job"
        required: false
        default: "200"
      dry-run:
        description: "Fetch profiles but write nothing"
        required: false
        default: "false"

# The called workflow writes `data/`, so this run has to hold the same group.
concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  fill-externals:
    # A called workflow may not be granted more than the caller has, so the
    # `contents: write` above is what lets the commit step push.
    uses: ./.github/workflows/fill-details-parallel.yml
    with:
      mode: externals
      limit: ${{ inputs.limit || '600' }}
      interval: ${{ inputs.interval || '200' }}
      dry-run: ${{ inputs.dry-run || 'false' }}
    secrets: inherit
