name: Import vtuber-db-wikiru VTubers

# Harvests vtuber-database.wikiru.jp (VtuberDB namelist CSV) and imports the
# new channels the gate admits into data/channels/. The harvest writes
# `.cache/vtuber-db-wikiru/vtuber-db-wikiru.json`, and the importer reads it,
# resolves each performer name to a YouTube channel via InnerTube search,
# confirms through classifyChannel(), and adds the survivors.
#
#   npm run data:vtuber-db-wikiru            # harvest the snapshot
#   npm run data:vtuber-db-wikiru-import     # report what would be imported
#   npm run data:vtuber-db-wikiru-import -- --apply  # write the new channels

on:
  schedule:
    # Weekly, Wednesday 03:00 UTC
    - cron: "0 3 * * 3"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest-and-import:
    name: Harvest and import vtuber-db-wikiru
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore vtuber-db-wikiru cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/vtuber-db-wikiru
          key: vtuber-db-wikiru-harvest-${{ github.run_number }}
          restore-keys: |
            vtuber-db-wikiru-harvest-

      - name: Harvest vtuber-db-wikiru
        run: npm run data:vtuber-db-wikiru

      - name: Import vtuber-db-wikiru channels
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would import vtuber-db-wikiru channels"
            npm run data:vtuber-db-wikiru-import
          else
            npm run data:vtuber-db-wikiru-import -- --apply
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit vtuber-db-wikiru imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "vtuber-db-wikiru imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import vtuber-db-wikiru VTubers (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import vtuber-db-wikiru VTubers"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | vtuber-database.wikiru.jp (VtuberDB namelist CSV) |"
            echo "| Step | harvest → resolve via YouTube search → gate → import → index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
