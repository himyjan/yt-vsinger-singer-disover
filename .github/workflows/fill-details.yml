name: Fill channel details (targeted)

# Fills the detail of **specific** records — one id, a name pass, a counts
# pass, a single platform. The everyday bulk fill is a separate workflow:
#
#   fill-details-parallel.yml — twenty jobs, one volume each, daily
#
# This one is for the cases that do not fan out. It used to carry the weekly
# bulk pass, and that is exactly why it could not keep up: a bounded run is
# ordered worst-first, so a record whose only gap was its links sat behind
# thousands with no avatar and was never reached. 「もかん ch / Mokan」 kept an
# empty `externals` block through every run because of it.
#
# YouTube keeps a channel's links on its **about page**, not in the
# microformat — fourteen channels with no `externals` sampled, the header
# supplied zero links and the about page supplied them for ten — so this pass
# asks for `about: true`, which is what fills the "all links" block.
#
#   npm run data:details -- --id UC…              # one record, now
#   npm run data:details -- --limit 2000          # a bounded slice
#   npm run data:details -- --counts-only --limit 500   # hidden follower counts
#   npm run data:details -- --name-only          # correct names and aliases
#   npm run data:details -- --platform <name>    # platform-specific fills
#
# Only fills what is empty on the record — nothing already present is
# overwritten.

on:
  workflow_dispatch:
    inputs:
      name-only:
        description: "Only correct names and aliases"
        required: false
        default: "false"
      counts-only:
        description: "Only fill hidden follower counts"
        required: false
        default: "false"
      limit:
        description: "Max channels to fill this run"
        required: false
        default: "2000"
      platform:
        description: "Platform to fill (bilibili, kick, ci.me, soop, etc.)"
        required: false
        default: ""
      id:
        description: "Fill these channel ids only, comma-separated (e.g. UC…,UC…)"
        required: false
        default: ""

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  fill-details:
    name: Fill channel details
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fill details
        env:
          CI_ME_CLIENT_ID: ${{ secrets.CI_ME_CLIENT_ID }}
          CI_ME_CLIENT_SECRET: ${{ secrets.CI_ME_CLIENT_SECRET }}
        run: |
          ARGS=(--limit "${{ inputs.limit || 2000 }}")

          if [ "${{ inputs.name-only }}" = "true" ]; then
            ARGS+=(--name-only)
          elif [ "${{ inputs.counts-only }}" = "true" ]; then
            ARGS+=(--counts-only)
          fi

          if [ -n "${{ inputs.platform }}" ]; then
            ARGS+=(--platform "${{ inputs.platform }}")
          fi

          # One record, filled now, whatever its state: the backlog is ordered
          # by what is missing, so a channel that lacks only its links can sit
          # behind thousands with no avatar and never be reached by a bounded
          # run. Comma-separated, so several ids fit in one dispatch.
          if [ -n "${{ inputs.id }}" ]; then
            ARGS+=(--id "${{ inputs.id }}")
          fi

          npm run data:details -- "${ARGS[@]}"

      # A detail pass renames channels and extends their alias lists, and the
      # aliases are what the search index holds — so committing without this
      # leaves a renamed channel unfindable under its new name until the next
      # run rebuilds the index. `data:index` is local and takes seconds.
      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit detail fills
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          # `reset --mixed`, not `rebase`: a detail pass rewrites shards, and
          # rebasing that onto a dataset another run also rewrote conflicts on
          # every derived file. The index follows the branch, the worktree
          # keeps what this run produced, and only `data/` is staged.
          git reset --mixed "origin/$BRANCH"
          git add data/
          if git diff --cached --quiet; then
            echo "details unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: fill missing details (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Fill channel details (targeted)"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Limit | ${{ inputs.limit || 2000 }} |"
            echo "| Name-only | ${{ inputs.name-only }} |"
            echo "| Counts-only | ${{ inputs.counts-only }} |"
            echo "| Platform | ${{ inputs.platform || 'all' }} |"
            echo "| Ids | ${{ inputs.id || '(none — worst-first backlog)' }} |"
            echo "| Bulk daily fill | \`fill-details-parallel.yml\` (20 jobs) |"
            echo "| Committed | \`data/\` |"
          } >> "$GITHUB_STEP_SUMMARY"
