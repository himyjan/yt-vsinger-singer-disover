name: Fill external links (weekly)

# Fills missing social links (Twitch, X, Instagram, TikTok, Bilibili, Niconico,
# CHZZK, CI.ME, SOOP, etc.) from roster sources:
#
#   npm run data:hololist-import -- --links --apply
#   npm run data:bacharu-import -- --links --apply
#
# Runs weekly so roster-linked accounts (Twitter, Twitch, Bilibili, etc.) are
# backfilled without blocking the daily sync. Only fills fields that are empty
# on the record — nothing already on the record is overwritten.

on:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  fill-links:
    name: Fill external links from rosters
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Both harvests are resumable through `.cache/` — HoloList keeps one page
      # per entry plus a `<lastmod>` state, bacharu one page per roster page —
      # and neither cache existed here, so every weekly run started from zero:
      # 9,359 entries and the whole bacharu roster, inside a 90-minute job.
      # The key is unique per run and `restore-keys` picks the newest previous
      # harvest, which is the standard rolling-cache pattern: a run resumes the
      # last one and its own cache becomes the next run's starting point.
      - name: Restore harvest caches
        uses: actions/cache@v6
        with:
          path: |
            .cache/hololist
            .cache/hololist.json
            .cache/bacharu
            .cache/bacharu-state.json
            .cache/bacharu-vtubers.json
          key: roster-harvest-${{ github.run_number }}
          restore-keys: |
            roster-harvest-

      - name: Harvest rosters (hololist + bacharu)
        run: |
          npm run data:hololist
          npm run data:bacharu

      - name: Fill external links from hololist
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "Dry run: would run hololist-import --links --apply"
          else
            npm run data:hololist-import -- --links --apply
          fi

      - name: Fill external links from bacharu
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "Dry run: would run bacharu-import --links --apply"
          else
            npm run data:bacharu-import -- --links --apply
          fi

      # The importers only fill empty fields, but they still rewrite the shards
      # they touch, and the search index is built from those shards.
      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit link fills
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          # `reset --mixed`, not `rebase`: the roster harvest rewrites whole
          # shards, and rebasing that onto a dataset another run also rewrote
          # conflicts on every derived file. The index follows the branch, the
          # worktree keeps what this run produced, and only `data/` is staged.
          git reset --mixed "origin/$BRANCH"
          git add data/
          if git diff --cached --quiet; then
            echo "external links unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: fill external links from rosters (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Fill external links (weekly)"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Hololist links | \`npm run data:hololist-import -- --links --apply\` |"
            echo "| Bacharu links | \`npm run data:bacharu-import -- --links --apply\` |"
            echo "| Committed | \`data/*\` |"
          } >> "$GITHUB_STEP_SUMMARY"
