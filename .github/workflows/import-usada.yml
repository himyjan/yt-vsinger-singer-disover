name: Import USADA VTubers

# Harvests USADA (usadanews.com) directory and imports the new channels the gate
# admits into data/channels/. The harvest writes `.cache/usada/usada.json`,
# and the importer reads it, matches each row against the dataset by YouTube
# channel id, classifies through classifyChannel(), and adds the survivors.
#
#   npm run data:usada              # harvest VTuber candidates from USADA
#   npm run data:usada-import       # report what would be imported
#   npm run data:usada-import -- --apply  # write the new channels
#
# USADA publishes a YouTube channel id for each entry, so matching against
# the dataset is direct (no search required).
#
# USADA is a VTuber directory — every entry is a virtual claim
# (`reincarnationOf`-eligible).  What a roster still must not buy is a fan:
# `detectClipAccount()` and `isFanAccountName()` must both be false.
#
#   npm run data:usada-import                     # report only
#   npm run data:usada-import -- --apply          # import the new channels

on:
  schedule:
    # Weekly, Monday 09:00 UTC (after the sync's roster pass)
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest-and-import:
    name: Harvest and import USADA VTubers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore usada cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/usada
          key: usada-harvest-${{ github.run_number }}
          restore-keys: |
            usada-harvest-

      - name: Harvest USADA
        run: npm run data:usada

      - name: Import USADA channels
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would import USADA channels"
            npm run data:usada-import
          else
            npm run data:usada-import -- --apply
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit USADA imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "USADA imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import USADA VTubers (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import USADA VTubers"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | USADA (usadanews.com/vtuber/) |"
            echo "| Credentials | none (public HTML) |"
            echo "| Step | harvest → resolve via YouTube search → gate → import → index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
