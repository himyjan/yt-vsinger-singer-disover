name: Import v-sai VTubers

# Harvests v-sai.com/vtuber and imports the new channels the gate admits into
# data/channels/. The harvest writes `.cache/v-sai/v-sai.json`, and the
# importer reads it, matches each row against the dataset by YouTube channel
# id, classifies through classifyChannel(), and adds the survivors.
#
#   npm run data:v-sai              # harvest the snapshot
#   npm run data:v-sai-import       # report what would be imported
#   npm run data:v-sai-import -- --apply  # write the new channels

on:
  schedule:
    # Weekly, Tuesday 03:00 UTC
    - cron: "0 3 * * 2"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest-and-import:
    name: Harvest and import v-sai
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore v-sai cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/v-sai
          key: v-sai-harvest-${{ github.run_number }}
          restore-keys: |
            v-sai-harvest-

      - name: Harvest v-sai
        run: npm run data:v-sai

      - name: Import v-sai channels
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would import v-sai channels"
            npm run data:v-sai-import
          else
            npm run data:v-sai-import -- --apply
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit v-sai imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "v-sai imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import v-sai VTubers (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import v-sai VTubers"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | v-sai.com/vtuber (Vietnamese VTuber directory) |"
            echo "| Step | harvest → import → index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
