name: Import VTuber-index VTubers

# Harvests vtuber-index.com VTuber directory and imports the new channels the gate
# admits into data/channels/. The harvest writes `.cache/vtuber-index/vtuber-index.json`,
# and the importer reads it, matches each row against the dataset by YouTube channel
# id, classifies through classifyChannel(), and adds the survivors.
#
#   npm run data:vtuber-index              # harvest VTuber candidates from vtuber-index.com
#   npm run data:vtuber-index-import       # report what would be imported
#   npm run data:vtuber-index-import -- --apply  # write the new channels
#
# vtuber-index.com publishes YouTube channel ids for each entry, so matching
# against the dataset is direct (no search required).
#
# vtuber-index is a VTuber directory — every entry is a virtual claim
# (`reincarnationOf`-eligible).  What a roster still must not buy is a fan:
# `detectClipAccount()` and `isFanAccountName()` must both be false.
#
#   npm run data:vtuber-index-import                     # report only
#   npm run data:vtuber-index-import -- --apply          # import the new channels

on:
  schedule:
    # Weekly, Monday 09:30 UTC (after the sync's roster pass)
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest-and-import:
    name: Harvest and import VTuber-index VTubers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore vtuber-index cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/vtuber-index
          key: vtuber-index-harvest-${{ github.run_number }}
          restore-keys: |
            vtuber-index-harvest-

      - name: Harvest vtuber-index
        run: npm run data:vtuber-index

      - name: Import vtuber-index channels
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would import vtuber-index channels"
            npm run data:vtuber-index-import
          else
            npm run data:vtuber-index-import -- --apply
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit vtuber-index imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "vtuber-index imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import vtuber-index VTubers (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import VTuber-index VTubers"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | vtuber-index.com (public JSON API) |"
            echo "| Credentials | none (public API) |"
            echo "| Step | harvest → resolve via YouTube search → gate → import → index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
