name: Live status

# Refreshes who is streaming right now, on every platform, and nothing else.
#
# Why this is not part of `sync-data.yml`: the live phase is the one whose cost
# is proportional to the **whole catalogue** — one InnerTube Live-tab lookup
# per YouTube channel, 63,000 of them. Inside the full sync that phase alone
# outlived the job's time limit, so the run was killed at 68% and committed
# nothing. Here it is the whole run.
#
# The arithmetic, measured rather than estimated:
#
#   one check, sequential      0.78 s   (250 ms throttle + two round-trips)
#   one check, behind a pool   0.176 s  (108 checks in 19 s)
#   one volume                 6,433 checks ≈ 19 min
#   all ten volumes            ≈ 3.1 h of pacing, ~13 h if sequential
#
# A single job cannot do that: GitHub caps a job at 6 h, and at ~5.7 checks/s
# per process the ten volumes are 13 h sequentially. So the catalogue is split
# into volumes (`volumeOf()` is rendezvous hashing, so a channel never moves)
# and the volumes are checked **in parallel, one group of two per job**. Five
# jobs at once ≈ 28 requests/s against InnerTube, and a full sweep takes ~40
# minutes instead of ten hours — which is what a "live now" tab is worth.
#
# Parallelism multiplies the *request rate*, not the work: each process paces
# itself with its own `RateLimiter`, so N jobs means N × 5.7 checks/s. That is
# why the groups are pairs (five jobs) rather than one volume each (ten jobs,
# ~57/s, ten independent backoffs the moment the source pushes back).
#
# Each job writes only its own volumes, in its own checkout — the `data/`
# symlink swap below is per-workspace, so nothing is shared. The single writer
# lock (`acquireRunLock`) still applies inside each job. The volumes travel
# back as artifacts and a fan-in job merges them, rebuilds the index, validates
# and commits **once**.
#
# `--live-only` loads `data/`, checks the platforms, and writes back only the
# item changes: new `live`/`upcoming` entries, and the streams that ended
# retired to `past` with a real duration.
#
# Repository secrets (all optional — a missing one just means that platform's
# live checks are skipped):
#   TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET
#   VK_ACCESS_TOKEN
#   CI_ME_CLIENT_ID / CI_ME_CLIENT_SECRET

on:
  schedule:
    # Every two hours, off the hour so the shared GitHub cron pool is happy.
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Check live status but write nothing"
        required: false
        default: "false"
      volume-count:
        description: "Number of volumes to split the catalogue into"
        required: false
        default: "10"

# One dataset, one writer: shares the `dataset-writer` concurrency group with
# `sync-data.yml`, `verify-data.yml` and `data-squash.yml`. `cancel-in-progress:
# false` means a sync that is already waiting is never replaced by this live
# run. `queue: max` keeps one run from dropping another out of the group.
concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  # Turns `volume-count` into the list of groups the matrix fans out over.
  # It is a job rather than an expression because a matrix cannot read an input
  # that a step computed.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - name: Work out the groups
        id: plan
        env:
          # Passed through the environment rather than interpolated: a
          # `workflow_dispatch` input is user-supplied text, and `${{ }}` puts
          # it in the script verbatim.
          COUNT: ${{ inputs.volume-count || 10 }}
        run: |
          # Two volumes per job: five jobs at once is ~28 requests/s, which is
          # the rate this pipeline is willing to ask of a free source.
          PER_JOB=2
          # Not `GROUPS`: bash keeps that name for the user's group IDs, and an
          # assignment to it is silently ignored — `$((GROUPS - 1))` then reads
          # the array and the matrix gets twenty bogus entries.
          GROUP_COUNT=$(( (COUNT + PER_JOB - 1) / PER_JOB ))
          JSON="["
          SEP=""
          for g in $(seq 0 $((GROUP_COUNT - 1))); do
            JSON="$JSON$SEP$g"
            SEP=","
          done
          JSON="$JSON]"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "groups=$JSON" >> "$GITHUB_OUTPUT"
          echo "splitting $COUNT volume(s) into $GROUP_COUNT job(s): $JSON"

  # One job per pair of volumes, all at once.
  volume:
    name: Volumes ${{ matrix.group }}
    needs: plan
    runs-on: ubuntu-latest
    # Two volumes × ~19 min, plus the split and the checkout. 60 minutes leaves
    # room for a source that pushes back.
    timeout-minutes: 60
    # A failure must abort the run, not produce a half-refreshed dataset that
    # the fan-in job would happily merge and commit.
    strategy:
      fail-fast: true
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Create volume split
        env:
          COUNT: ${{ needs.plan.outputs.count }}
        run: npm run data:volumes -- --count "$COUNT"

      - name: Which volumes this job owns
        id: mine
        env:
          COUNT: ${{ needs.plan.outputs.count }}
          GROUP: ${{ matrix.group }}
        run: |
          FIRST=$(( GROUP * 2 ))
          LIST=""
          PATHS=""
          for v in $(seq "$FIRST" $((FIRST + 1))); do
            if [ "$v" -lt "$COUNT" ]; then
              LIST="$LIST $v"
              PATHS="${PATHS}.volumes/vol-$v"$'\n'
            fi
          done
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          printf 'paths=%s' "$PATHS" >> "$GITHUB_OUTPUT"
          echo "job $GROUP owns volumes:$LIST"

      - name: Check live status for this group
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          CI_ME_CLIENT_ID: ${{ secrets.CI_ME_CLIENT_ID }}
          CI_ME_CLIENT_SECRET: ${{ secrets.CI_ME_CLIENT_SECRET }}
        run: |
          # 7,000 is above the largest volume's UC count (6,433 measured), so a
          # volume is covered whole — the cap must not cut its tail, because
          # `page` never advances when the limit covers the whole set.
          ARGS=(--live-only --limit-live 7000 --limit-multi-platform-live 400)
          ARGS+=(--live-concurrency 6 --innertube-delay 150)
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi

          for v in ${{ steps.mine.outputs.list }}; do
            echo "=== Processing volume $v ==="

            # Copy shared root-level files into this volume's data/ so sync.ts
            # can read them when data/ is symlinked to this volume.
            VOL_DIR=".volumes/vol-$v/data"
            for f in overrides.json seed-catalog.json suggestions.json upstream.json manifest.json; do
              if [ -f "data/$f" ]; then
                cp "data/$f" "$VOL_DIR/$f"
              fi
            done

            # Swap root data/ for this volume's slice so sync.ts only sees this
            # volume's channels. Restore afterwards so the next volume starts
            # from the full dataset.
            mv data data-full
            ln -s "$VOL_DIR" data

            npx tsx scripts/sync.ts -- "${ARGS[@]}"

            rm -f data
            mv data-full data
          done

      - name: Upload the refreshed volumes
        uses: actions/upload-artifact@v7
        with:
          name: volumes-${{ matrix.group }}
          path: ${{ steps.mine.outputs.paths }}
          # Only the fan-in job reads these, and it runs in minutes.
          retention-days: 1
          if-no-files-found: error

  # Downloads every group's volumes, merges them into one `data/`, and commits
  # once. This is the only job that writes to the repository.
  merge:
    name: Merge and commit
    needs: [plan, volume]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download the refreshed volumes
        uses: actions/download-artifact@v8
        with:
          pattern: volumes-*
          path: .volumes-raw

      - name: Place them where the merge expects them
        run: |
          mkdir -p .volumes
          for dir in .volumes-raw/volumes-*; do
            for vol in "$dir"/vol-*; do
              [ -d "$vol" ] || continue
              name=$(basename "$vol")
              rm -rf ".volumes/$name"
              mv "$vol" ".volumes/$name"
              echo "restored $name"
            done
          done

      - name: Merge all volumes into data/
        env:
          COUNT: ${{ needs.plan.outputs.count }}
        run: npx tsx scripts/merge-volumes.ts --count "$COUNT"

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Check the stored repository size
        run: npm run repo:size -- --max-mb 900 --warn-mb 700

      - name: Rebase data changes onto the latest branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          git rebase --autostash "origin/$BRANCH"

      - name: Commit live status
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "data: live status (${{ github.run_number }})"
          file_pattern: "data/*"
          branch: ${{ github.ref_name }}
          skip_fetch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Live status"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Volumes | ${{ needs.plan.outputs.count }}, checked in parallel |"
            echo "| Jobs | ${{ needs.plan.outputs.groups }} × 2 volumes |"
            echo "| Live pass | \`--live-only\` per volume, then merged |"
            echo "| Index | rebuilt after merge |"
            echo "| Committed | \`data/\` |"
          } >> "$GITHUB_STEP_SUMMARY"
