name: Live status

# Refreshes who is streaming right now, on every platform, and nothing else.
#
# Why this is not part of `sync-data.yml`: the live phase is the one whose cost
# is proportional to the **whole catalogue** — one InnerTube Live-tab lookup
# per YouTube channel, 63,000 of them, at roughly a second or two each. Inside
# the full sync that phase alone outlived the job's time limit, so the run was
# killed at 68% and committed nothing. Here it is the whole run, it fits, and
# the full sync stays short enough to always reach its write step.
#
# The catalogue is split into 10 volumes (`npm run data:volumes -- --count 10`).
# Each volume (~5,000–7,000 channels) is processed sequentially in one job
# (~2–4 min each, ~30 min total), well inside the 90-minute ceiling. This gives
# full catalogue coverage every sweep instead of ~1 day with the old shard
# rotation.
#
# `--live-only` loads `data/`, checks the platforms, and writes back only the
# item changes: new `live`/`upcoming` entries, and the streams that ended
# retired to `past` with a real duration.
#
# Repository secrets (all optional — a missing one just means that platform's
# live checks are skipped):
#   TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET
#   VK_ACCESS_TOKEN
#   CI_ME_CLIENT_ID / CI_ME_CLIENT_SECRET

on:
  schedule:
    # Every two hours, off the hour so the shared GitHub cron pool is happy.
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Check live status but write nothing"
        required: false
        default: "false"
      volume-count:
        description: "Number of volumes to split the catalogue into"
        required: false
        default: "10"

# One dataset, one writer: shares the `dataset-writer` concurrency group with
# `sync-data.yml`, `verify-data.yml` and `data-squash.yml`. `cancel-in-progress:
# false` means a sync that is already waiting is never replaced by this live
# run. `queue: max` keeps one run from dropping another out of the group.
concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  live:
    name: Refresh live status
    runs-on: ubuntu-latest
    # 10 volumes × ~3 min each = ~30 min total, well inside the 90-minute
    # ceiling with headroom for a slow source.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Create volume split (10 volumes)
        run: npm run data:volumes -- --count ${{ inputs.volume-count || 10 }}

      - name: Process each volume sequentially
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          CI_ME_CLIENT_ID: ${{ secrets.CI_ME_CLIENT_ID }}
          CI_ME_CLIENT_SECRET: ${{ secrets.CI_ME_CLIENT_SECRET }}
        run: |
          ARGS=(--live-only --limit-live 6000 --limit-multi-platform-live 400)
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS+=(--dry-run); fi

          VOLUME_COUNT="${{ inputs.volume-count || 10 }}"
          for v in $(seq 0 $((VOLUME_COUNT - 1))); do
            echo "=== Processing volume $v / $((VOLUME_COUNT - 1)) ==="

            # Copy shared root-level files into this volume's data/ so sync.ts
            # can read them when data/ is symlinked to this volume.
            VOL_DIR=".volumes/vol-$v/data"
            for f in overrides.json seed-catalog.json suggestions.json upstream.json manifest.json; do
              if [ -f "data/$f" ]; then
                cp "data/$f" "$VOL_DIR/$f"
              fi
            done

            # Swap root data/ for this volume's slice so sync.ts only sees
            # this volume's channels. Restore afterwards so the next volume
            # starts from the full dataset.
            mv data data-full
            ln -s "$VOL_DIR" data

            npx tsx scripts/sync.ts -- "${ARGS[@]}"

            rm -f data
            mv data-full data
          done

      - name: Merge all volumes into data/
        run: npx tsx scripts/merge-volumes.ts --count ${{ inputs.volume-count || 10 }}

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Check the stored repository size
        run: npm run repo:size -- --max-mb 900 --warn-mb 700

      - name: Rebase data changes onto the latest branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          git rebase --autostash "origin/$BRANCH"

      - name: Commit live status
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "data: live status (${{ github.run_number }})"
          file_pattern: "data/*"
          branch: ${{ github.ref_name }}
          skip_fetch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Live status"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Volumes processed | ${{ inputs.volume-count || 10 }} (sequential in one job) |"
            echo "| Live pass | `--live-only` per volume, then merged |"
            echo "| Index | rebuilt after merge |"
            echo "| Committed | \`data/\` |"
          } >> "$GITHUB_STEP_SUMMARY"
