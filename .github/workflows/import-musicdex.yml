name: Import Musicdex channels and songs

# Harvests channel profiles and songs from Musicdex (music.holodex.net) and
# enriches the dataset with curated song title, original artist, category,
# channel agency, avatar, subscriber count, and more.
# The harvest writes `.cache/musicdex/musicdex.json`, and the importer
# reads it, matches channels by YouTube channel id and songs by YouTube
# video id, and writes enriched records back to data/channels/ and
# data/items/<region>/<bucket>.json.
#
#   npm run data:musicdex              # harvest channel profiles + songs
#   npm run data:musicdex-import       # report what would be enriched
#   npm run data:musicdex-import -- --apply  # write the enriched data
#
# The public API at https://music.holodex.net/api/v2/ needs no key. When
# MUSICDEX_API_KEY / HOLODEX_API_KEY is set, the keyed API path is used
# instead. Playwright is used as a fallback to discover orgs from the
# homepage.

on:
  schedule:
    # Weekly, Tuesday 04:00 UTC (after the sync's song enrichment pass)
    - cron: "0 4 * * 2"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest-and-import:
    name: Harvest and import Musicdex channels and songs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chrome for Playwright (org discovery fallback)
        run: npx playwright install chromium

      - name: Restore musicdex cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/musicdex
          key: musicdex-harvest-${{ github.run_number }}
          restore-keys: |
            musicdex-harvest-

      - name: Harvest Musicdex channels and songs
        env:
          MUSICDEX_API_KEY: ${{ secrets.MUSICDEX_API_KEY }}
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: npm run data:musicdex

      - name: Import Musicdex channels and songs
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ ! -f .cache/musicdex/musicdex.json ]; then
            echo "No musicdex snapshot found — nothing to import (harvest may have found no data)."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would enrich musicdex channels and items"
            npm run data:musicdex-import
          else
            npm run data:musicdex-import -- --apply
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit musicdex imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/items data/songs data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "Musicdex imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import musicdex channel profiles and songs (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import Musicdex channels and songs"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | Musicdex (music.holodex.net) |"
            echo "| Credentials | MUSICDEX_API_KEY / HOLODEX_API_KEY (optional; public API works without) |"
            echo "| Step | harvest → match channels/items/songs → enrich → index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/items\`, \`data/songs\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
