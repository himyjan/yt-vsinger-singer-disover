name: Import vtuber-db-wikiru VTubers (All)

# Harvests vtuber-database.wikiru.jp (VtuberDB namelist CSV) and imports the
# new channels the gate admits into data/channels/. Unlike the fixed
# import-vtuber-db-wikiru.yml (one sequential job), this workflow dynamically
# calculates import parallelism: job_count = ceil(total entries / 50). Each
# import job processes one shard of the entry set via --shard N/M, so every
# entry is checked exactly once.
#
#   Step 1 (1 job): harvest the snapshot from vtuber-database.wikiru.jp
#   Step 2 (plan job): count total entries, compute job_count = ceil(N/50)
#   Step 3 (job_count parallel jobs): import each shard via --shard INDEX/JOB_COUNT
#   Step 4 (fan-in): index → validate → commit

on:
  schedule:
    # Weekly, Wednesday 03:00 UTC
    - cron: "0 3 * * 3"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest:
    name: Harvest vtuber-db-wikiru snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore vtuber-db-wikiru cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/vtuber-db-wikiru
          key: vtuber-db-wikiru-harvest-${{ github.run_number }}
          restore-keys: |
            vtuber-db-wikiru-harvest-

      - name: Harvest vtuber-db-wikiru
        run: npm run data:vtuber-db-wikiru

      - name: Upload harvest snapshot
        uses: actions/upload-artifact@v7
        with:
          name: vtuber-db-wikiru-snapshot
          path: .cache/vtuber-db-wikiru/vtuber-db-wikiru.json
          retention-days: 1

  plan:
    name: Calculate import job count
    needs: [harvest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      job_count: ${{ steps.count.outputs.job_count }}
      matrix: ${{ steps.count.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download harvest snapshot
        uses: actions/download-artifact@v8
        with:
          name: vtuber-db-wikiru-snapshot
          path: .cache/vtuber-db-wikiru

      - name: Count entries and calculate job count
        id: count
        run: |
          # Count total entries in the harvest snapshot.
          TOTAL=$(node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync('.cache/vtuber-db-wikiru/vtuber-db-wikiru.json','utf8'));
              console.log(Array.isArray(d) ? d.length : 0);
            } catch { console.log(0); }
          ")
          echo "Total entries: $TOTAL"

          # job_count = ceil(total_entries / 50), capped at 20.
          JOB_COUNT=$(( (TOTAL + 49) / 50 ))
          if [ "$JOB_COUNT" -gt 20 ]; then JOB_COUNT=20; fi
          if [ "$JOB_COUNT" -lt 1 ]; then JOB_COUNT=1; fi

          # Generate JSON matrix [0, 1, ..., JOB_COUNT-1] (0-based for --shard).
          MATRIX=$(node -e "console.log(JSON.stringify(Array.from({length:$JOB_COUNT},(_,i)=>i)))")

          echo "Import jobs: $JOB_COUNT (limit 50 entries per job)"
          echo "job_count=$JOB_COUNT" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  import:
    name: Import vtuber-db-wikiru shard ${{ matrix.job }}+1/${{ needs.plan.outputs.job_count }}
    needs: [harvest, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Up to 20 concurrent jobs for public repos.
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download harvest snapshot
        uses: actions/download-artifact@v8
        with:
          name: vtuber-db-wikiru-snapshot
          path: .cache/vtuber-db-wikiru

      - name: Import vtuber-db-wikiru shard ${{ matrix.job }}+1
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # Each job owns shard (matrix.job + 1) of JOB_COUNT total shards.
          # Entries are distributed by index modulo shard count, so every
          # entry is processed by exactly one job.
          JOB_COUNT=${{ needs.plan.outputs.job_count }}
          SHARD_INDEX=$(( ${{ matrix.job }} + 1 ))
          ARGS="--shard ${SHARD_INDEX}/${JOB_COUNT}"
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry run: would import vtuber-db-wikiru shard $SHARD_INDEX/$JOB_COUNT"
            npm run data:vtuber-db-wikiru-import $ARGS
          else
            npm run data:vtuber-db-wikiru-import -- $ARGS --apply
          fi

  merge-and-commit:
    name: Index, validate, and commit
    needs: [harvest, plan, import]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit vtuber-db-wikiru imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "vtuber-db-wikiru imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import vtuber-db-wikiru VTubers (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import vtuber-db-wikiru VTubers (All)"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | vtuber-database.wikiru.jp (VtuberDB namelist CSV) |"
            echo "| Step 1 | Harvest snapshot (1 job) |"
            echo "| Step 2 | Plan job: job_count = ceil(total_entries / 50), capped at 20 |"
            echo "| Step 3 | ${{ needs.plan.outputs.job_count }} parallel import jobs (--shard INDEX/JOB_COUNT) |"
            echo "| Step 4 | Index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
