name: Deploy site

# Builds the Vue app and publishes it to GitHub Pages.
#
# The dataset in `data/` is committed to the repository and copied into the
# build output by `scripts/prepare-public.ts`, so Pages serves both the app
# and the data from the same origin — no CORS configuration needed.
#
# **A `push` alone is not enough to publish a dataset update.** Every workflow
# that writes `data/` commits with the repository `GITHUB_TOKEN`, and GitHub
# deliberately does not start workflows from events that token creates — the
# anti-recursion rule. So the bot's commits triggered no `push` at all: the
# site kept serving whatever a human had last pushed. Measured on
# 2026-10-31, the live run committed `data: live status (25)` at 03:48 and
# this workflow never ran, while a hand push four minutes earlier deployed
# normally.
#
# `workflow_run` is not subject to that rule, which is why every writer is
# listed below: the deploy runs when the writer finishes, checks out the
# default branch — where the data commit now is — and publishes it.
#
# A burst of writers collapses into one deployment by the `pages` concurrency
# group, so listing six workflows does not mean six deploys.

on:
  push:
    branches: [main]
  workflow_run:
    # Exact `name:` of each workflow that commits to `data/`.
    workflows:
      - Live status
      - Sync dataset
      - Fill channel details (parallel)
      - Fill channel details (targeted)
      - Fill external links (weekly)
      - Verify dataset
      - Squash the data history
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # A writer that failed still may have committed (the live fan-in commits
    # after its merge), so a failure is not a reason to skip: the build
    # validates the dataset either way and a broken one fails here rather than
    # being published.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate dataset
        run: npm run data:validate

      - name: Build
        run: npm run build
        env:
          # A project site is served from `/<repo>/`, so that is the default;
          # the repository variable overrides it — set `/` for a site on a
          # custom domain, which is served from the root.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
