name: Import Hololist VTubers

# Harvests hololist.net and imports the new channels the gate admits into
# data/channels/. The harvest reads WordPress sitemaps and each entry page
# (no API key — public HTML), writes `.cache/hololist.json`, and the importer
# matches each entry against the dataset by YouTube channel id or @handle,
# resolving unknown handles through InnerTube, classifies through
# classifyChannel(), and adds the survivors.
#
#   npm run data:hololist              # harvest the snapshot
#   npm run data:hololist-import       # report what would be imported
#   npm run data:hololist-import -- --apply  # write the new channels
#
# hololist publishes a @handle, never a UC… id, so a handle the dataset has
# never heard of costs one InnerTube resolve_url call. Answers are cached in
# .cache/hololist-resolved.json so a second run does not repeat them.
#
# hololist is a VTuber directory — every entry is a virtual claim
# (`reincarnationOf`-eligible). What a roster still must not buy is a fan:
# `detectClipAccount()` and `isFanAccountName()` must both be false.
#
#   npm run data:hololist-import                     # report only
#   npm run data:hololist-import -- --apply          # import the new channels
#   npm run data:hololist-import -- --links --apply  # also attach externals

on:
  schedule:
    # Weekly, Thursday 03:00 UTC
    - cron: "0 3 * * 4"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest-and-import:
    name: Harvest and import Hololist
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore hololist cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/hololist
          key: hololist-harvest-${{ github.run_number }}
          restore-keys: |
            hololist-harvest-

      - name: Harvest hololist
        run: npm run data:hololist

      - name: Import hololist channels
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would import hololist channels"
            npm run data:hololist-import
          else
            npm run data:hololist-import -- --apply
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit hololist imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "hololist imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import hololist VTubers (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import Hololist VTubers"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | hololist.net |"
            echo "| Credentials | none (public HTML, InnerTube for handle resolution) |"
            echo "| Step | harvest → resolve handles → import → index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
