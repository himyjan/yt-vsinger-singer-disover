name: Import vt.rita.moe VTubers

# Harvests vt.rita.moe (/vt/list) and imports the new channels the gate admits
# into data/channels/. The harvest writes `.cache/rita/rita.json`, and the
# importer reads it, matches each row against the dataset by YouTube channel id
# (or another platform id when there is no YouTube), classifies through
# classifyChannel(), and adds the survivors.
#
# No authentication required.
#
#   npm run data:rita              # harvest VTuber candidates from vt.rita.moe
#   npm run data:rita-import       # report what would be imported
#   npm run data:rita-import -- --apply  # write the new channels

on:
  schedule:
    # Weekly, Monday 08:00 UTC (after the sync's roster pass)
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest-and-import:
    name: Harvest and import vt.rita.moe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore rita cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/rita
          key: rita-harvest-${{ github.run_number }}
          restore-keys: |
            rita-harvest-

      - name: Harvest vt.rita.moe
        run: npm run data:rita

      - name: Import vt.rita.moe channels
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would import vt.rita.moe channels"
            npm run data:rita-import
          else
            npm run data:rita-import -- --apply
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit vt.rita.moe imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "vt.rita.moe imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import vt.rita.moe VTubers (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import vt.rita.moe VTubers"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | vt.rita.moe (/vt/list) |"
            echo "| Credentials | none (public JSON API) |"
            echo "| Step | harvest → import → index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
