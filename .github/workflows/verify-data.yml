name: Verify dataset

# Checks uncertain classifications against the web using Google Search
# grounding, and records the answers as overrides.
#
# The keyword classifier is fast and free but wrong often enough to matter.
# This job asks a search-grounded model to verify the channels it is least
# sure about, and writes the corrections to `data/overrides.json` — which the
# normal sync then applies.
#
# Because the corrections land in a normal file, every change is reviewable
# in a diff and can be reverted by deleting one entry.
#
# Required repository secret:
#   GEMINI_API_KEY — a key from https://aistudio.google.com/apikey
#
# The free tier is enough: the default model is `gemini-2.5-flash`.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many channels to verify in this run"
        required: false
        default: "40"
      max-confidence:
        description: "Only verify channels at or below this confidence"
        required: false
        default: "1"
      min-confidence:
        description: "Only accept corrections at or above this confidence"
        required: false
        default: "0.7"
      links:
        description: "Channels to look up for a missing YouTube/Twitch link (0 disables)"
        required: false
        default: "120"
  schedule:
    # Daily, at an odd minute to avoid the shared cron pool's peak.
    - cron: "43 4 * * *"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify and commit corrections
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify channels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run data:verify -- \
            --limit ${{ inputs.limit || 40 }} \
            --confidence ${{ inputs.max-confidence || 1 }} \
            --min-confidence ${{ inputs.min-confidence || 0.7 }}

      # The Bilibili-only part of the catalogue has no YouTube or Twitch link.
      # This pass finds the ones the performers publish — from their own text,
      # their X bio, Wikidata, and a search-grounded model — and lets the
      # discovered YouTube channel's published country correct the region.
      # Sharded by run number so the backlog is covered a slice at a time.
      - name: Resolve cross-platform links
        if: inputs.links != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SHARD_COUNT=8
          SHARD_INDEX=$(( (GITHUB_RUN_NUMBER - 1) % SHARD_COUNT + 1 ))
          npm run data:links -- \
            --limit ${{ inputs.links || 120 }} \
            --shard "${SHARD_INDEX}/${SHARD_COUNT}" \
            --web

      - name: Re-apply corrections and rebuild the index
        run: |
          npm run data:sync -- --no-search
          npm run data:index
          npm run data:validate

      - name: Rebase data changes onto the latest branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          git rebase --autostash "origin/$BRANCH"

      - name: Commit corrections
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "data: verify classifications (${{ github.run_number }})"
          file_pattern: "data/*"
          branch: ${{ github.ref_name }}
          # The explicit rebase above is the only branch update. A second
          # fetch/rebase inside this action can conflict with generated shards.
          skip_fetch: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
