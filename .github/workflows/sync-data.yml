name: Sync dataset

# Refreshes the global roster and cross-platform records from the public
# catalogs, then enriches channel profiles and media. InnerTube is the default
# YouTube source; configured APIs add discovery and specialized metadata.
#
# The YouTube Data API free tier allows 10,000 units per day. Each run spends
# at most `--budget` units and the remaining balance is cached between runs,
# so several runs a day can never exceed the daily allowance.
#
# Repository secrets:
#   YOUTUBE_API_KEY       — YouTube Data API v3 key (optional)
#   TWITCH_CLIENT_ID      — Twitch application client id     (optional)
#   TWITCH_CLIENT_SECRET  — Twitch application client secret (optional)
#   VK_ACCESS_TOKEN       — VK service token                 (optional)
#   CI_ME_CLIENT_ID       — CI.ME Open API client id          (optional)
#   CI_ME_CLIENT_SECRET   — CI.ME Open API client secret      (optional)
#   ANALYTICS_REPO_TOKEN  — write access to the public analytics archive (optional)

on:
  schedule:
    # Every 6 hours, off the hour so the shared GitHub cron pool is happy.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Quota units this run may spend (max 10000)"
        required: false
        default: "2500"
      no-search:
        description: "Skip discovery searches (refresh known channels only)"
        required: false
        default: "false"
      keyword:
        description: "Custom channel discovery query across supported platforms"
        required: false
        default: ""
      dry-run:
        description: "Fetch and classify but do not write anything"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync and commit dataset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore quota state
        uses: actions/cache@v6
        with:
          path: .cache
          key: yt-quota-${{ github.run_number }}
          restore-keys: |
            yt-quota-

      - name: Clear stale analytics export
        run: rm -f .cache/analytics-pending.json

      - name: Sync dataset
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          CI_ME_CLIENT_ID: ${{ secrets.CI_ME_CLIENT_ID }}
          CI_ME_CLIENT_SECRET: ${{ secrets.CI_ME_CLIENT_SECRET }}
          SYNC_KEYWORD: ${{ inputs.keyword }}
        run: |
          ARGS=(--budget "${{ inputs.budget || 2500 }}" --roster)
          if [ "${{ inputs.no-search }}" = "true" ]; then ARGS+=(--no-search); fi
          if [ "${{ inputs.dry-run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$SYNC_KEYWORD" ]; then ARGS+=(--keyword "$SYNC_KEYWORD"); fi
          npm run data:sync -- "${ARGS[@]}"

      - name: Check analytics archive credentials
        id: analytics-auth
        env:
          ANALYTICS_REPO_TOKEN: ${{ secrets.ANALYTICS_REPO_TOKEN }}
        run: |
          if [ -n "$ANALYTICS_REPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANALYTICS_REPO_TOKEN is missing; daily analytics will not be archived."
          fi

      - name: Checkout analytics archive
        if: steps.analytics-auth.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          repository: himyjan/yt-vsinger-singer-disover-analytics
          token: ${{ secrets.ANALYTICS_REPO_TOKEN }}
          path: analytics-archive

      - name: Append platform analytics
        if: steps.analytics-auth.outputs.enabled == 'true' && inputs.dry-run != 'true'
        run: npm run data:analytics:append -- analytics-archive

      - name: Commit platform analytics
        if: steps.analytics-auth.outputs.enabled == 'true'
        working-directory: analytics-archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: append daily platform analytics"
            git push
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Rebase data changes onto the latest branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          git rebase --autostash "origin/$BRANCH"

      - name: Commit dataset
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "data: sync global cross-platform roster (${{ github.run_number }})"
          file_pattern: "data/*"
          branch: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Dataset sync"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Roster and music catalogs | vdb, Taiwan VTuber Tracking Data, VocaDB, VTuber Music Dataset |"
            echo "| Platform discovery | YouTube, Bilibili, Niconico, CHZZK, SOOP live feed; Twitch/VK require credentials; KICK/CI.ME known IDs only |"
            echo "| Quota used | ${{ steps.quota.outputs.used || 'n/a' }} |"
            echo "| Committed | \`data/\` |"
          } >> "$GITHUB_STEP_SUMMARY"
