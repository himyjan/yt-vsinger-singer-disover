name: Import vtuberdex VTubers

# Harvests vtuberdex.pages.dev and imports the new channels the gate admits
# into data/channels/. The harvest writes `.cache/vtuberdex/vtuberdex.json`,
# and the importer reads it, matches each row against the dataset by YouTube
# channel id, classifies through classifyChannel(), and adds the survivors.
#
#   npm run data:vtuberdex           # harvest the snapshot
#   npm run data:vtuberdex-import    # report what would be imported
#   npm run data:vtuberdex-import -- --apply  # write the new channels

on:
  schedule:
    # Weekly, Thursday 03:00 UTC
    - cron: "0 3 * * 4"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest-and-import:
    name: Harvest and import vtuberdex
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore vtuberdex cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/vtuberdex
          key: vtuberdex-harvest-${{ github.run_number }}
          restore-keys: |
            vtuberdex-harvest-

      - name: Harvest vtuberdex
        run: npm run data:vtuberdex

      - name: Import vtuberdex channels
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would import vtuberdex channels"
            npm run data:vtuberdex-import
          else
            npm run data:vtuberdex-import -- --apply
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit vtuberdex imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "vtuberdex imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import vtuberdex VTubers (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import vtuberdex VTubers"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | vtuberdex.pages.dev |"
            echo "| Step | harvest → import → index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
