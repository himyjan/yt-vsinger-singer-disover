name: Import vtuber-db VTubers

# Harvests vtuber-database.wikiru.jp (VtuberDB) Cargo tables and imports the
# new channels the gate admits into data/channels/. The harvest writes
# `.cache/vtuber-db/vtuber-db.json`, and the importer reads it, matches each
# row against the dataset by YouTube channel id, classifies through
# classifyChannel(), and adds the survivors.
#
#   npm run data:vtuber-db           # harvest the snapshot
#   npm run data:vtuber-db-import    # report what would be imported
#   npm run data:vtuber-db-import -- --apply  # write the new channels

on:
  schedule:
    # Weekly, Wednesday 03:00 UTC
    - cron: "0 3 * * 3"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would change without writing"
        required: false
        default: "false"

concurrency:
  group: dataset-writer-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  harvest-and-import:
    name: Harvest and import vtuber-db
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install --skip-repo
          git lfs pull || true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore vtuber-db cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/vtuber-db
          key: vtuber-db-harvest-${{ github.run_number }}
          restore-keys: |
            vtuber-db-harvest-

      - name: Harvest vtuber-db
        run: npm run data:vtuber-db

      - name: Import vtuber-db channels
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would import vtuber-db channels"
            npm run data:vtuber-db-import
          else
            npm run data:vtuber-db-import -- --apply
          fi

      - name: Build search index
        run: npm run data:index

      - name: Validate dataset
        run: npm run data:validate

      - name: Commit vtuber-db imports
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --mixed "origin/$BRANCH"
          git add data/channels data/search data/manifest.json
          if git diff --cached --quiet; then
            echo "vtuber-db imports unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "data: import vtuber-db VTubers (${{ github.run_number }})"
          git push origin "HEAD:$BRANCH"

      - name: Summary
        run: |
          {
            echo "### Import vtuber-db VTubers"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | vtuber-database.wikiru.jp (VtuberDB Cargo tables) |"
            echo "| Step | harvest → import → index → validate → commit |"
            echo "| Dry run | ${{ inputs.dry-run }} |"
            echo "| Committed | \`data/channels\`, \`data/search\`, \`data/manifest.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"
